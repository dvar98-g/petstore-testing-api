name: API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: ${{ matrix.module }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: user
            classes: CreateUserTest,LoginTest,LogoutTest
          - module: pet
            classes: CreatePetTest,FindByStatusTest,GetPetTest
          - module: store
            classes: CreateOrderTest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      DEFAULT_TIMEOUT_SECONDS: ${{ secrets.DEFAULT_TIMEOUT_SECONDS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Run ${{ matrix.module }} tests
        run: mvn -B test -Dtest=${{ matrix.classes }}